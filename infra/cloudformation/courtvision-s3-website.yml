AWSTemplateFormatVersion: "2010-09-09"
Description: CourtVision S3 static website hosting and cache resources.

Parameters:
  ProjectName:
    Type: String
    Default: courtvision
  CacheTableName:
    Type: String
    Default: courtvision-cache

Resources:
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${ProjectName}-frontend-${AWS::AccountId}-${AWS::Region}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: PublicReadForStaticWebsite
            Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub "${FrontendBucket.Arn}/*"

  S3CacheBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${ProjectName}-cache-${AWS::AccountId}-${AWS::Region}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: ExpireCacheObjects
            Status: Enabled
            ExpirationInDays: 14

  CacheTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref CacheTableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: cache_key
          AttributeType: S
      KeySchema:
        - AttributeName: cache_key
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true

Outputs:
  FrontendBucketName:
    Value: !Ref FrontendBucket
  WebsiteUrl:
    Value: !GetAtt FrontendBucket.WebsiteURL
  S3CacheBucketName:
    Value: !Ref S3CacheBucket
  CacheTableName:
    Value: !Ref CacheTable
